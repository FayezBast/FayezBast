<svg xmlns="http://www.w3.org/2000/svg" width="900" height="332" viewBox="0 0 900 332" role="img" aria-labelledby="title desc">
  <title id="title">Contribution map</title>
  <desc id="desc">Four routes group the contributed projects. GitHub star counts appear beside each project.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#14132b"/>
      <stop offset="1" stop-color="#081824"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#293750" stroke-opacity=".48"/>
    </pattern>
    <clipPath id="frame"><rect width="900" height="332" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .heading { font-size: 26px; font-weight: 700; fill: #f0f6fc; }
    .route, .caption { font-size: 13px; font-weight: 700; letter-spacing: 1.8px; }
    .route { fill: currentColor; }
    .station { font-size: 20px; font-weight: 650; fill: #e6edf3; }
    .star-badge { fill: #1a2436; stroke: #39485e; }
    .stars { font-size: 13px; font-weight: 600; fill: #d5e0ee; text-anchor: middle; }
    .star-icon { fill: #e6ca85; }
    .track { stroke: currentColor; stroke-width: 2; stroke-opacity: .65; stroke-linecap: round; }
    .stop { fill: #101726; stroke: currentColor; stroke-width: 3; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="332" fill="url(#background)"/>
    <rect width="900" height="332" fill="url(#grid)"/>
    <text class="heading" x="34" y="44">Contribution map</text>
    <text class="caption" x="866" y="42" text-anchor="end" fill="#a9bad2">MERGED PULL REQUESTS</text>
    <path d="M34 62H866" stroke="#526384" stroke-opacity=".5"/>

    <g color="#c4a4ff">
      <text class="route" x="34" y="119">AI &amp; VOICE</text>
      <path class="track" d="M244 114H866"/>
      <circle class="stop" cx="292" cy="114" r="5"/>
      <circle class="stop" cx="592" cy="114" r="5"/>
      <text class="station" x="283" y="98">OpenAI Agents SDK</text>
      <rect class="star-badge" x="489" y="80" width="78" height="24" rx="12"/>
      <text class="stars" x="528" y="97"><tspan class="star-icon">★</tspan> 30,549</text>
      <text class="station" x="583" y="98">Page Agent</text>
      <rect class="star-badge" x="708" y="80" width="78" height="24" rx="12"/>
      <text class="stars" x="747" y="97"><tspan class="star-icon">★</tspan> 29,650</text>
    </g>
    <g color="#85aaff" transform="translate(0 59)">
      <text class="route" x="34" y="119">DATA &amp; PLATFORMS</text>
      <path class="track" d="M244 114H866"/>
      <circle class="stop" cx="292" cy="114" r="5"/>
      <circle class="stop" cx="592" cy="114" r="5"/>
      <text class="station" x="283" y="98">World Monitor</text>
      <rect class="star-badge" x="432" y="80" width="78" height="24" rx="12"/>
      <text class="stars" x="471" y="97"><tspan class="star-icon">★</tspan> 90,314</text>
      <text class="station" x="583" y="98">Backstage</text>
      <rect class="star-badge" x="696" y="80" width="78" height="24" rx="12"/>
      <text class="stars" x="735" y="97"><tspan class="star-icon">★</tspan> 34,797</text>
    </g>
    <g color="#53d5ee" transform="translate(0 118)">
      <text class="route" x="34" y="119">CLOUD NATIVE</text>
      <path class="track" d="M244 114H866"/>
      <circle class="stop" cx="292" cy="114" r="5"/>
      <circle class="stop" cx="592" cy="114" r="5"/>
      <text class="station" x="283" y="98">Prometheus</text>
      <rect class="star-badge" x="412" y="80" width="78" height="24" rx="12"/>
      <text class="stars" x="451" y="97"><tspan class="star-icon">★</tspan> 67,419</text>
      <text class="station" x="583" y="98">Kubescape</text>
      <rect class="star-badge" x="704" y="80" width="78" height="24" rx="12"/>
      <text class="stars" x="743" y="97"><tspan class="star-icon">★</tspan> 11,850</text>
    </g>
    <g color="#a5b4fc" transform="translate(0 177)">
      <text class="route" x="34" y="119">LOCALIZATION</text>
      <path class="track" d="M244 114H292"/>
      <circle class="stop" cx="292" cy="114" r="5"/>
      <text class="station" x="283" y="98">PPSSPP</text>
      <rect class="star-badge" x="378" y="80" width="78" height="24" rx="12"/>
      <text class="stars" x="417" y="97"><tspan class="star-icon">★</tspan> 14,853</text>
    </g>
  </g>
</svg>
