<svg width="900" height="250" viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fayez Bast, software engineer">
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', Consolas, Menlo, monospace; }
    .fade { animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    .d1 { animation-delay: 0.15s; }
    .d2 { animation-delay: 0.35s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .blob1 { animation: drift1 16s ease-in-out infinite alternate; }
    .blob2 { animation: drift2 20s ease-in-out infinite alternate; }
    .blob3 { animation: drift3 18s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0, 0); }    to { transform: translate(-70px, 26px); } }
    @keyframes drift2 { from { transform: translate(0, 0); }    to { transform: translate(-50px, -34px); } }
    @keyframes drift3 { from { transform: translate(0, 0); }    to { transform: translate(60px, -20px); } }
    .sheen { animation: sweep 5.5s ease-in-out 1.4s infinite; }
    @keyframes sweep {
      0%   { transform: translateX(0); }
      38%  { transform: translateX(700px); }
      100% { transform: translateX(700px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .fade, .blob1, .blob2, .blob3, .sheen { animation: none !important; }
    }
  </style>
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="900" height="250" rx="16"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b15"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ruleG" gradientUnits="userSpaceOnUse" x1="64" y1="184" x2="324" y2="184">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="nameG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#94a9cf"/>
    </linearGradient>
    <linearGradient id="sheenG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16223f" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <mask id="nameMask">
      <text x="60" y="160" class="sans" font-size="72" font-weight="800" letter-spacing="-2" fill="#ffffff">Fayez Bast</text>
    </mask>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="900" height="250" fill="url(#bg)"/>
    <rect x="0" y="0" width="900" height="250" fill="url(#grid)" opacity="0.55"/>

    <ellipse class="blob1" cx="730" cy="60" rx="180" ry="95" fill="#2563eb" opacity="0.5" filter="url(#soft)"/>
    <ellipse class="blob2" cx="860" cy="205" rx="150" ry="90" fill="#06b6d4" opacity="0.38" filter="url(#soft)"/>
    <ellipse class="blob3" cx="130" cy="245" rx="180" ry="80" fill="#7c3aed" opacity="0.32" filter="url(#soft)"/>

    <g stroke="#2c3d63" stroke-width="1.5" fill="none" opacity="0.9">
      <path d="M22 40 V22 H40"/>
      <path d="M860 22 H878 V40"/>
      <path d="M22 210 V228 H40"/>
      <path d="M878 210 V228 H860"/>
    </g>
    <text x="852" y="44" text-anchor="end" class="mono fade d1" font-size="11" letter-spacing="2" fill="#4a5b7d">// applied ai &amp; systems</text>

    <text x="64" y="86" class="sans fade d1" font-size="12" font-weight="600" letter-spacing="6" fill="url(#accent)">SOFTWARE ENGINEER</text>

    <g class="fade d2">
      <text x="60" y="160" class="sans" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#nameG)">Fayez Bast</text>
      <g mask="url(#nameMask)">
        <rect class="sheen" x="-140" y="92" width="130" height="80" fill="url(#sheenG)" opacity="0.6"/>
      </g>
    </g>

    <line x1="64" y1="184" x2="324" y2="184" stroke="url(#ruleG)" stroke-width="3" stroke-linecap="round" class="fade d2"/>
  </g>
</svg>
