<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fayez Bast — software engineer">
  <style>
    .overline {
      font: 600 12px -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      letter-spacing: 5px;
      fill: #58a6ff;
    }
    .name {
      font: 700 68px -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      letter-spacing: -2px;
      fill: #f0f6fc;
    }
    .role {
      font: 400 16px 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', Consolas, Menlo, monospace;
      letter-spacing: 1.5px;
      fill: #8b949e;
    }
    .fade { animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    .d1 { animation-delay: 0.1s; }
    .d2 { animation-delay: 0.3s; }
    .d3 { animation-delay: 0.55s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .rule {
      stroke-dasharray: 220;
      animation: draw 1s 0.45s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }
    @keyframes draw {
      from { stroke-dashoffset: 220; }
      to   { stroke-dashoffset: 0; }
    }
    .cursor { animation: blink 1.1s steps(1) 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="rule-g" gradientUnits="userSpaceOnUse" x1="46" y1="168" x2="266" y2="168">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#00d9ff"/>
    </linearGradient>
    <linearGradient id="fade-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.45" stop-color="#fff"/>
    </linearGradient>
    <mask id="dots-m">
      <rect x="580" y="20" width="290" height="190" fill="url(#fade-g)"/>
    </mask>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#58a6ff"/>
    </pattern>
  </defs>

  <rect x="580" y="20" width="290" height="190" fill="url(#dots)" mask="url(#dots-m)" opacity="0.16" class="fade d3"/>

  <text x="46" y="66" class="overline fade d1">SOFTWARE&#160;ENGINEER</text>
  <text x="44" y="138" class="name fade d1">Fayez Bast</text>
  <line x1="46" y1="168" x2="266" y2="168" stroke="url(#rule-g)" stroke-width="3" stroke-linecap="round" class="rule"/>
  <text x="46" y="207" class="role fade d2">agent&#160;infrastructure&#160;&amp;&#160;backend&#160;systems&#160;<tspan class="cursor" fill="#58a6ff">&#9612;</tspan></text>
</svg>
